openapi: 3.0.0
info:
  title: API de Dicionário
  description: API para consulta de palavras em inglês, gerenciamento de favoritos e histórico de buscas
  version: 1.0.0
  contact:
    name: API Support
    email: support@example.com

servers:
  - url: http://localhost:8000
    description: Servidor de desenvolvimento

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          description: ID do usuário (hash MD5)
        name:
          type: string
          description: Nome do usuário
        email:
          type: string
          format: email
          description: Email do usuário
        favorites:
          type: string
          description: Mensagem sobre favoritos do usuário

    Word:
      type: object
      properties:
        word:
          type: string
          description: Palavra em inglês
        meanings:
          type: array
          items:
            type: object
            properties:
              partOfSpeech:
                type: string
                description: Classe gramatical
              definitions:
                type: array
                items:
                  type: string
                  description: Definição da palavra

    History:
      type: object
      properties:
        word:
          type: string
          description: Palavra pesquisada
        added:
          type: string
          format: date-time
          description: Data e hora da pesquisa

    Favorite:
      type: object
      properties:
        word:
          type: string
          description: Palavra favoritada
        added:
          type: string
          format: date-time
          description: Data e hora do favorito

    Error:
      type: object
      properties:
        message:
          type: string
          description: Mensagem de erro

paths:
  /:
    get:
      summary: Informações da API
      description: Retorna informações sobre a API
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Fullstack Challenge 🏅 - Dictionary"

  /auth/signup:
    post:
      summary: Cadastro de usuário
      description: Cria um novo usuário no sistema
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Usuário criado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  token:
                    type: string
        '400':
          description: Erro na criação do usuário
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/signin:
    get:
      summary: Login de usuário
      description: Autentica um usuário no sistema
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
            format: email
        - name: password
          in: query
          required: true
          schema:
            type: string
            format: password
      responses:
        '200':
          description: Login realizado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  token:
                    type: string
        '400':
          description: Credenciais inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /entries/en/{word}:
    get:
      summary: Detalhes de uma palavra
      description: Retorna os detalhes e significados de uma palavra
      security:
        - bearerAuth: []
      parameters:
        - name: word
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Detalhes da palavra
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Word'
        '400':
          description: Palavra não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /entries/en:
    get:
      summary: Lista de palavras
      description: Retorna uma lista paginada de palavras
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Lista de palavras
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: string
                  totalDocs:
                    type: integer
                  page:
                    type: integer
                  totalPages:
                    type: integer
                  hasNext:
                    type: boolean
                  hasPrev:
                    type: boolean

  /entries/en/{word}/favorite:
    post:
      summary: Adicionar aos favoritos
      description: Adiciona uma palavra aos favoritos do usuário
      security:
        - bearerAuth: []
      parameters:
        - name: word
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Palavra adicionada aos favoritos
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          description: Erro ao adicionar aos favoritos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /entries/en/{word}/unfavorite:
    delete:
      summary: Remover dos favoritos
      description: Remove uma palavra dos favoritos do usuário
      security:
        - bearerAuth: []
      parameters:
        - name: word
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Palavra removida dos favoritos
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          description: Erro ao remover dos favoritos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /user/me:
    get:
      summary: Dados do usuário
      description: Retorna os dados do usuário autenticado
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dados do usuário
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /user/me/history:
    get:
      summary: Histórico de palavras
      description: Retorna o histórico de palavras pesquisadas pelo usuário
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 4
      responses:
        '200':
          description: Histórico de palavras
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/History'
                  totalDocs:
                    type: integer
                  page:
                    type: integer
                  totalPages:
                    type: integer
                  hasNext:
                    type: boolean
                  hasPrev:
                    type: boolean

  /user/me/favorites:
    get:
      summary: Lista de favoritos
      description: Retorna a lista de palavras favoritas do usuário
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Lista de favoritos
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/Favorite'
                  totalDocs:
                    type: integer
                  page:
                    type: integer
                  totalPages:
                    type: integer
                  hasNext:
                    type: boolean
                  hasPrev:
                    type: boolean 